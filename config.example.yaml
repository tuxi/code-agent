# ── 项目级配置（project-level config.yaml）──────────────────────
# 模型/凭证定义已迁至 ~/.codeagent/config.yaml（首次启动自动生成模板）。
# 内建 registry 提供 deepseek / qwen / glm / ollama / gateway 的开箱模型;
# 用户级文件在其基础上追加或覆盖自定义连接与凭证。
# 于此只留项目级语义：default_model + server + agent + provider + web + hooks + runtime。

default_model: deepseek-pro

# ── Runtime Server 访问控制 ───────────────────────────────────
# Embedded Runtime 不读取这里的认证配置：AgentKit 每次启动都通过
# CodeAgentRuntime 接口注入一个仅驻留内存的随机 Bearer Token。
# 独立运行的 codeagent serve / codeagentd 可从本地 YAML 或环境变量读取
# 固定 Access Token；环境变量有值时优先，便于生产部署覆盖本地配置。
server:
  display_name: "My CodeAgent Runtime"
  authentication: bearer
  # 本地开发：复制为 config.yaml 后，生成一次 Token 并填写在这里。
  # config.yaml 已被 .gitignore 排除，请勿把真实 Token 提交到版本库。
  # access_token: "<openssl rand -base64 32 的输出>"
  # 生产/远程部署推荐环境变量；有值时覆盖 access_token。
  access_token_env: CODEAGENT_SERVER_ACCESS_TOKEN
  public_healthz: true
  # 直接监听非 loopback 地址时必须同时配置 TLS。若由反向代理终止 TLS，
  # 请让 CodeAgent 只监听 127.0.0.1，并在代理层暴露服务。
  # tls_certificate: "/etc/codeagent/server.crt"
  # tls_private_key: "/etc/codeagent/server.key"

agent:
  max_steps: 48
  max_parallel_tools: 8
  compact_ratio: 0.75
  client_tool_timeout_seconds: 900

provider:
  request_timeout_seconds: 600
  max_retries: 5
  backoff_millis: 500
  max_backoff_seconds: 8

currency: "$"

web:
  search:
    provider: tavily
    tavily_api_key_env: TAVILY_API_KEY
    # Managed mode（可选）：复用 gateway/default JWT，Gateway 托管 Tavily 凭证。
    # provider: gateway
    # gateway_base_url: "https://agent.xxx.com/api/v1/agent"
    # credential:
    #   namespace: gateway
    #   name: default
    top_k: 5
    timeout_seconds: 10
  fetch:
    timeout_seconds: 30
    cache_ttl_seconds: 600

hooks:
  - event: post_tool_use
    match: edit_file
    command: gofmt -w .
  - event: pre_tool_use
    match: run_command
    command: 'if grep -q "rm -rf"; then echo "blocked: refusing rm -rf"; exit 1; fi'

runtime:
  max_concurrent_turns: 5
